name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c 'import runpy; print(runpy.run_path("src/smartvoice/_version.py")["__version__"])')"
          if [[ "$GITHUB_REF_NAME" != v* || "$expected" != "$actual" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version $actual (v$actual)." >&2
            exit 1
          fi
      - name: Run unit and API tests
        run: python scripts/test.py ci
      - name: Build and validate source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: smartvoice-dist-source
          path: dist/*
          if-no-files-found: error

  platform-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libopenblas-dev
      - name: Set up MSYS2 toolchain
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            diffutils
            gcc
            make
            mingw-w64-ucrt-x86_64-openblas
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c 'import runpy; print(runpy.run_path("src/smartvoice/_version.py")["__version__"])')"
          if [[ "$GITHUB_REF_NAME" != v* || "$expected" != "$actual" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version $actual (v$actual)." >&2
            exit 1
          fi
      - name: Build and validate platform wheel
        shell: bash
        env:
          SMARTVOICE_RELEASE_TARGET: ${{ matrix.target }}
          SMARTVOICE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python -m pip install build twine
          python -m build --wheel
          if [[ "$SMARTVOICE_RELEASE_TARGET" == "linux-x64" ]]; then
            python -m pip install auditwheel
            auditwheel repair --plat manylinux_2_38_x86_64 --wheel-dir dist/repaired dist/*.whl
            rm dist/*.whl
            mv dist/repaired/*.whl dist/
            rmdir dist/repaired
            auditwheel show dist/*.whl
          fi
          python -m twine check dist/*.whl
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          target = os.environ["SMARTVOICE_RELEASE_TARGET"]
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "smartvoice/resources/smartvoice.json",
              "smartvoice/resources/models.json",
              "smartvoice/resources/router.json",
          }
          if target == "macos-arm64":
              required.add("smartvoice/resources/bin/qwen_tts")
              if "macosx_11_0_arm64" not in wheel.name:
                  raise SystemExit(f"Unexpected macOS wheel tag: {wheel.name}")
          elif target == "windows-x64":
              required.add("smartvoice/resources/bin/qwen_tts.exe")
              if "win_amd64" not in wheel.name:
                  raise SystemExit(f"Unexpected Windows wheel tag: {wheel.name}")
          elif target == "linux-x64":
              required.add("smartvoice/resources/bin/qwen_tts")
              required.add("smartvoice/resources/bin/licenses/linux-runtime-dependencies.txt")
              if "manylinux_2_38_x86_64" not in wheel.name:
                  raise SystemExit(f"Unexpected Linux wheel tag: {wheel.name}")
              with tempfile.TemporaryDirectory() as temporary:
                  with ZipFile(wheel) as archive:
                      archive.extract("smartvoice/resources/bin/qwen_tts", temporary)
                  executable = Path(temporary) / "smartvoice/resources/bin/qwen_tts"
                  executable.chmod(executable.stat().st_mode | 0o111)
                  result = subprocess.run([executable, "--self-test"], capture_output=True, text=True)
                  if result.returncode or "SELF-TEST PASSED" not in result.stdout:
                      raise SystemExit(f"Repaired Linux runtime self-test failed: {result.stderr}")
          missing = required - names
          if missing:
              raise SystemExit(f"{target} wheel is missing files: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smartvoice-dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-sdist, platform-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: smartvoice-dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "doc/releases/$GITHUB_REF_NAME.md"
          fi

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PYPI_PUBLISH == 'true'
    needs: [test-and-sdist, platform-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/smartvoice/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smartvoice-dist-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
