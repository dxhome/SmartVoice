name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit and API tests
        run: python scripts/test.py ci
      - name: Set up Linux wheel build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libopenblas-dev
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
