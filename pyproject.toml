[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "smartvoice"
dynamic = ["version"]
description = "Local speech-to-text and text-to-speech service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-multipart>=0.0.18,<1.0",
    "langid>=1.1.6,<2.0",
    "sherpa-onnx>=1.13.8,<2.0",
    "numpy>=1.26,<3.0",
    "av>=12.0,<19.0",
]

[project.optional-dependencies]
streaming = ["ctranslate2==4.8.2", "sentencepiece==0.2.2", "websockets>=13,<17"]
model-preparation = ["ctranslate2==4.8.2", "transformers==4.57.3", "torch==2.14.0", "sentencepiece==0.2.2"]
dev = [
    "httpx>=0.27,<1.0",
    "httpx2>=2.0.0",
    "jiwer>=4.0,<5.0",
]

[project.urls]
Homepage = "https://github.com/dxhome/SmartVoice"
Repository = "https://github.com/dxhome/SmartVoice"
Issues = "https://github.com/dxhome/SmartVoice/issues"

[tool.setuptools.dynamic]
version = {attr = "smartvoice._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartvoice = ["web/*.html", "resources/*.json", "resources/*.png", "resources/bin/*", "resources/bin/lib/*", "resources/bin/licenses/*", "ascii-art.txt"]
