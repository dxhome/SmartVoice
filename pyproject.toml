[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartvoice"
version = "0.1.0"
description = "Local speech-to-text and text-to-speech service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-multipart>=0.0.18,<1.0",
    "langid>=1.1.6,<2.0",
]

[project.optional-dependencies]
inference = [
    "sherpa-onnx>=1.13.8,<2.0",
    "numpy>=1.26,<3.0",
    "av>=12.0,<19.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "jiwer>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
