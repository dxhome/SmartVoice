 ws.onerror=()=>ws.rejectReady(Error(t('connectFailed')));ws.onclose=()=>{clearInterval(heartbeatTimer);if(token!==run)return;if(!opened)ws.rejectReady(Error(t('cannotConnect')));else ws.rejectReady(Error(t('notReady')));if(!completed&&!canceled){status(t('interrupted'),true);canceled=true;stopNodes();finishUI()}else if(!completed){status(t('canceledClosed'));finishUI()}};
 await ready;const pacingStart=performance.now();for(let start=0;start<audio.length;start+=320){if(canceled||token!==run||ws.readyState!==WebSocket.OPEN)return;const slice=audio.subarray(start,start+320),pcm=new ArrayBuffer(slice.length*2),view=new DataView(pcm);slice.forEach((sample,i)=>view.setInt16(i*2,Math.max(-32768,Math.min(32767,Math.round(sample*32768))),true));if(ws.bufferedAmount>320000)throw Error(t('sendBuffer'));if(inputStart===null)inputStart=performance.now();ws.send(pcm);const delay=pacingStart+(start+slice.length)/16-performance.now();if(delay>0)await new Promise(resolve=>setTimeout(resolve,delay))}send({type:'finish'});status(t('finishDrain'));
 }catch(error){const message=error.name==='NotSupportedError'||error.name==='ReferenceError'?t('audioUnsupported'):error.name==='NotAllowedError'?t('audioStartupFailed'):error.message===t('durationLimit')||error.message===t('onsetLimit')?error.message:t('audioStartupFailed');status(message,true);canceled=true;send({type:'cancel'});stopNodes();finishUI()}
}
async function loadCapabilities(){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);if($('retryCapabilities'))$('retryCapabilities').hidden=true;if($('start'))$('start').disabled=true;capabilitiesLoaded=false;status(t('loading'));try{const response=await fetch('/v1/audio/stream/capabilities',{signal:controller.signal,headers:{accept:'application/json'}});if(!response.ok)throw Error(`HTTP ${response.status}`);const value=await response.json();if(!Array.isArray(value.chains))throw Error('Invalid capabilities response');capabilities=value;capabilitiesLoaded=true;const requestedMode=location.hash.slice(1);const modeSelect=$('mode');if(modeSelect){if(['transcription','translated_subtitles','spoken_interpretation'].includes(requestedMode))modeSelect.value=requestedMode;mode=modeSelect.value||mode}updateAvailability();status(value.enabled?t('enabled'):t('serviceOff'))}catch(error){console.error('Streaming capability request failed:',error);capabilitiesLoaded=false;updateAvailability();status(error.name==='AbortError'?t('capabilityTimeout'):t('capabilityError'),true);if($('retryCapabilities'))$('retryCapabilities').hidden=false}finally{clearTimeout(timeout)}}
function initializeStreamingPage(){initializeLocale();$('start')?.addEventListener('click',start);$('language')?.addEventListener('change',updateAvailability);$('cancel')?.addEventListener('click',()=>{canceled=true;send({type:'cancel'});stopNodes();if(!ws||ws.readyState!==WebSocket.OPEN){ws?.close();status(t('canceled'));finishUI()}else status(t('canceling'))});window.addEventListener('pagehide',()=>{canceled=true;send({type:'cancel'});stopNodes();ws?.close();context?.close()});$('#retryCapabilities')?.addEventListener('click',loadCapabilities);$('#localeSelect')?.addEventListener('change',event=>{try{localStorage.setItem('smartvoice-locale',event.target.value)}catch(_){}applyLocale(event.target.value)});loadCapabilities()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initializeStreamingPage,{once:true});else initializeStreamingPage();
