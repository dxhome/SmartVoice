<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartVoice · 流式处理</title>
<style>
:root{--ink:#163047;--muted:#526777;--line:#dce5eb;--accent:#087a89;--surface:#f5f8fa;--error:#aa3023}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.6 system-ui,sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:24px}header strong{font-size:18px}a{color:var(--accent);text-underline-offset:3px}main{max-width:1280px;margin:auto;padding:24px}.intro{color:var(--muted);max-width:75ch}.layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:24px}.input,.output{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}h1{font-size:26px;margin:0}h2{font-size:18px;margin:24px 0 10px}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs button{flex:1;padding:10px 4px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}.tabs [aria-selected=true]{color:white;background:var(--accent);border-color:var(--accent)}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;color:white;background:var(--accent)}button:disabled{cursor:default;opacity:.55}button:hover:not(:disabled){filter:brightness(.94)}label{display:block;margin:18px 0 6px;font-weight:600}input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:white}input[type=file]{padding:8px}textarea{resize:vertical}.actions{display:flex;gap:10px;margin-top:20px}.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;font-variant-numeric:tabular-nums}.metrics span{display:block;font-size:12px;color:var(--muted)}.metrics strong{display:block;font-size:18px}.hint{font-size:12px;color:var(--muted);margin-top:8px}.draft{color:var(--muted)}.text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}.text p{margin:0 0 10px}#state.error{color:var(--error)}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}summary{cursor:pointer;color:var(--muted)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}::selection{background:#c5e8eb;color:var(--ink)}[hidden]{display:none!important}@media(max-width:760px){main{padding:16px}.layout{grid-template-columns:1fr}header{padding:14px 16px;flex-wrap:wrap}.metrics{gap:6px}.metrics strong{font-size:16px}}
</style></head>
<body><header><strong>SmartVoice</strong><a href="/console">返回控制台</a><a href="/docs">API 文档</a></header>
<main><h1>流式处理</h1><p class="intro">选择原文字幕、译文字幕或译文语音。当前版本为预览，支持中文与英文；灰色字幕可修订，定稿保持不变。</p><div class="layout"><section class="input" aria-label="输入设置">
<nav class="tabs" role="tablist" aria-label="处理场景"><button role="tab" id="tab-source" aria-controls="settings" aria-selected="true" data-mode="transcription">原文字幕</button><button role="tab" id="tab-target" aria-controls="settings" aria-selected="false" tabindex="-1" data-mode="translated_subtitles">译文字幕</button><button role="tab" id="tab-speech" aria-controls="settings" aria-selected="false" tabindex="-1" data-mode="spoken_interpretation">译文语音</button></nav>
<div id="settings" role="tabpanel" aria-labelledby="tab-source"><label for="file">本地音频</label><input id="file" type="file" accept="audio/*"><label for="language">源语言</label><select id="language"><option value="zh">中文 → English</option><option value="en">English → 中文</option></select><p class="hint">原文字幕保留源语言，翻译场景使用另一种语言。</p><label for="glossary">姓名 / 术语词表（可选 JSON）</label><textarea id="glossary" rows="3" placeholder='[{"source":"莱顿","target":"Layton"}]'>[]</textarea><label for="onset">原音语音起点（可选，秒）</label><input id="onset" type="number" min="0" step="0.01" placeholder="未标注时只显示首帧延迟"><div class="actions"><button id="start">开始处理</button><button id="cancel" class="secondary" disabled>取消</button></div><p id="state" role="status" aria-live="polite">正在读取服务能力…</p><p id="availability" class="hint"></p></div>
</section><section class="output" aria-label="实时输出"><div class="metrics"><div><span>会话就绪</span><strong id="ready">—</strong></div><div><span>原文 partial</span><strong id="source-time">—</strong></div><div><span>译文 partial</span><strong id="target-time">—</strong></div><div><span>TTFO 首块</span><strong id="audio-time">—</strong></div></div><p id="clock" class="hint">同一浏览器单调时钟。单次值不代表 P90；TTFO 以完整首块 WAV 到达为准。</p><h2>原文</h2><div id="source" class="text"></div><h2>译文</h2><div id="target" class="text"></div><p id="playback" class="hint">译文语音按生成顺序播放。</p><details><summary>会话状态与阶段指标</summary><pre id="diagnostics">尚未运行</pre></details></section></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let mode='transcription',capabilities,ws,context,run=0,canceled=false,inputStart=null,launch=null,audioDescriptor=null,nextAudioTime=0,activeNodes=[],messageChain=Promise.resolve(),first={},sourceRows=new Map(),targetRows=new Map();
const format=t=>t===null?'—':t<1000?`${Math.round(t)} ms`:`${(t/1000).toFixed(2)} s`;
function status(text,error=false){$('state').textContent=text;$('state').classList.toggle('error',error)}
function selectMode(button){if(ws&&ws.readyState<2)return;mode=button.dataset.mode;document.querySelectorAll('[role=tab]').forEach(b=>{b.setAttribute('aria-selected',String(b===button));b.tabIndex=b===button?0:-1});$('settings').setAttribute('aria-labelledby',button.id);location.hash=mode;updateAvailability()}
function updateAvailability(){const chain=capabilities?.chains?.find(c=>c.mode===mode&&c.source_language===$('language').value);$('start').disabled=!capabilities?.enabled||!chain?.available;$('availability').textContent=!capabilities?.enabled?'请在服务配置中启用 streaming_enabled。':chain?.available?'模型链路已安装。输入按实时速度发送；会话上限 300 秒，包含初始化和排空。':`链路不可用：${chain?.reason||'请安装所需模型'} ${(chain?.missing_models||[]).join(', ')}`}
function send(row){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(row))}
function mark(kind,received){if(inputStart===null||first[kind]!==undefined)return;const annotated=$('onset').value!=='';const offset=annotated?Number($('onset').value)*1000:0;const value=received-inputStart-offset;first[kind]=value;$({source:'source-time',target:'target-time',audio:'audio-time'}[kind]).textContent=value>=0?format(value):'起点标注无效'}
function render(rows,id){const fragment=document.createDocumentFragment();for(const value of rows.values()){if(!value.text)continue;const p=document.createElement('p');p.textContent=value.text;p.classList.toggle('draft',!value.committed);fragment.append(p)}$(id).replaceChildren(fragment);$(id).scrollTop=$(id).scrollHeight}
function setRow(rows,event,id){const old=rows.get(event.unit_id);if(old?.committed)return;if(old&&old.revision>=event.revision)return;rows.set(event.unit_id,event);while(rows.size>128)rows.delete(rows.keys().next().value);render(rows,id)}
async function handle(message,received,token){if(token!==run)return;if(typeof message.data!=='string'){
 if(!audioDescriptor)throw Error('音频缺少事件描述');const descriptor=audioDescriptor;audioDescriptor=null;if(message.data.byteLength!==descriptor.audio_bytes)throw Error('音频长度不一致');mark('audio',received);send({type:'ack',event_sequence:descriptor.event_sequence});const buffer=await context.decodeAudioData(message.data);if(canceled||token!==run)return;const node=context.createBufferSource();node.buffer=buffer;node.connect(context.destination);const begin=Math.max(context.currentTime+.04,nextAudioTime);nextAudioTime=begin+buffer.duration;activeNodes.push(node);const timer=setTimeout(()=>{if(!canceled&&token===run){if(inputStart!==null&&first.playback===undefined)first.playback=performance.now()-inputStart;send({type:'audio_started',audio_sequence:descriptor.audio_sequence});$('playback').textContent=`正在播放第 ${descriptor.audio_sequence} 块：${descriptor.text}`}},Math.max(0,(begin-context.currentTime)*1000));node.onended=()=>{clearTimeout(timer);activeNodes=activeNodes.filter(n=>n!==node);if(!canceled&&token===run){first.lastPlayed=performance.now()-inputStart;first.playedCount=(first.playedCount||0)+1;send({type:'audio_played',audio_sequence:descriptor.audio_sequence})}};node.start(begin);return;
 }
 const event=JSON.parse(message.data);if(event.type==='audio_segment'){if(audioDescriptor)throw Error('音频事件缺少二进制载荷');audioDescriptor=event;return}if(event.event_sequence)send({type:'ack',event_sequence:event.event_sequence});
 if(event.type==='session_ready'){$('ready').textContent=format(received-launch);status('处理进行中');ws.resolveReady(event)}
 if(event.type==='source_unit_partial'||event.type==='source_unit_final'){if(event.type==='source_unit_partial'&&event.text?.trim())mark('source',received);setRow(sourceRows,event,'source')}
 if(event.type==='target_partial'||event.type==='target_final'){if(event.type==='target_partial'&&event.text?.trim()&&!event.retracted)mark('target',received);setRow(targetRows,event,'target')}
 if(event.type==='audio_skipped'){$('playback').textContent=`部分语音跳过：${event.reason}`}
 if(event.type==='error'){status(`${event.code}：${event.message}。检查模型与服务配置后重试。`,true);ws.rejectReady(Error(event.message));canceled=true;stopNodes();$('diagnostics').textContent=JSON.stringify(event,null,2);finishUI()}
 if(event.type==='session_complete'){status(`会话结束：${event.status}`);if(mode==='spoken_interpretation'&&event.counts?.audio_segment)$('playback').textContent=event.status==='complete'?'语音播放已排空。':`可用语音已排空；会话状态：${event.status}`;$('diagnostics').textContent=JSON.stringify({...event,browser_metrics:{clock:'performance.now; one browser monotonic clock',onset_seconds:$('onset').value!==''?Number($('onset').value):null,source_partial_ms:first.source??null,target_partial_ms:first.target??null,ttfo_audio_ms:first.audio??null,ttfsa_first_pcm_ms:first.playback??null,input_to_last_played_ms:first.lastPlayed??null,played_chunks:first.playedCount||0,scope:'audio start scheduling/end callback; not physical audibility'}},null,2);finishUI()}
}
function stopNodes(){for(const node of activeNodes){try{node.stop()}catch(_){}}activeNodes=[]}
function finishUI(){$('cancel').disabled=true;document.querySelectorAll('[role=tab],#language,#file,#onset,#glossary').forEach(e=>e.disabled=false);updateAvailability()}
async function start(){const file=$('file').files[0];if(!file){status('请选择本地音频。',true);return}if(file.size>25*1024*1024){status('音频文件须小于 25 MiB。',true);return}let glossary;try{glossary=JSON.parse($('glossary').value||'[]')}catch(_){status('词表须为有效 JSON。',true);return}if(!Array.isArray(glossary)){status('词表须为 JSON 数组。',true);return}if($('onset').value!==''&&(!Number.isFinite(Number($('onset').value))||Number($('onset').value)<0)){status('语音起点须为非负秒数。',true);return}
 canceled=false;ws=null;run+=1;const token=run;first={};sourceRows.clear();targetRows.clear();$('source').replaceChildren();$('target').replaceChildren();['ready','source-time','target-time','audio-time'].forEach(id=>$(id).textContent='—');inputStart=null;audioDescriptor=null;messageChain=Promise.resolve();stopNodes();if(context)await context.close();context=new AudioContext();await context.resume();nextAudioTime=0;launch=performance.now();$('start').disabled=true;$('cancel').disabled=false;document.querySelectorAll('[role=tab],#language,#file,#onset,#glossary').forEach(e=>e.disabled=true);status('解码音频并准备会话…');$('clock').textContent=`同一浏览器单调时钟；${$('onset').value!==''?'从标注的原音语音起点计时':'未标注语音起点：从首帧发送计时，不能用于起点目标验收'}。单次值不代表 P90。`;
 try{const decoded=await context.decodeAudioData(await file.arrayBuffer());if(decoded.duration>300)throw Error('请使用不超过 300 秒的音频');if($('onset').value!==''&&Number($('onset').value)>=decoded.duration)throw Error('语音起点须小于音频时长');const offline=new OfflineAudioContext(1,Math.ceil(decoded.duration*16000),16000),src=offline.createBufferSource();src.buffer=decoded;src.connect(offline.destination);src.start();const audio=(await offline.startRendering()).getChannelData(0);if(canceled||token!==run)return;
 ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/v1/audio/stream`);ws.binaryType='arraybuffer';const ready=new Promise((resolve,reject)=>{ws.resolveReady=resolve;ws.rejectReady=reject});let opened=false,completed=false;
 ws.onopen=()=>{if(canceled||token!==run){ws.close();finishUI();return}opened=true;send({type:'configure',protocol:'smartvoice.stream.v1',mode,source_language:$('language').value,...(mode==='transcription'?{}:{target_language:$('language').value==='zh'?'en':'zh'}),audio:{encoding:'pcm_s16le',sample_rate:16000,channels:1},glossary,output_consumption:mode==='spoken_interpretation'?'playback':'delivery'})};
 ws.onmessage=message=>{const received=performance.now();if(typeof message.data==='string'){try{const row=JSON.parse(message.data);if(['error','session_complete'].includes(row.type))completed=true}catch(error){status('服务事件格式无效，请重试。',true);canceled=true;send({type:'cancel'});finishUI();return}}messageChain=messageChain.then(()=>handle(message,received,token)).catch(error=>{status(error.message,true);canceled=true;send({type:'cancel'});stopNodes();finishUI()})};
 ws.onerror=()=>ws.rejectReady(Error('连接失败，请检查服务地址'));ws.onclose=()=>{if(token!==run)return;if(!opened)ws.rejectReady(Error('无法连接服务'));else ws.rejectReady(Error('会话在就绪前关闭'));if(!completed&&!canceled){status('连接中断；本次输出未完整完成，请重新开始。',true);canceled=true;stopNodes();finishUI()}else if(!completed){status('已取消，连接已关闭。');finishUI()}};
 await ready;const pacingStart=performance.now();for(let start=0;start<audio.length;start+=320){if(canceled||token!==run||ws.readyState!==WebSocket.OPEN)return;const slice=audio.subarray(start,start+320),pcm=new ArrayBuffer(slice.length*2),view=new DataView(pcm);slice.forEach((sample,i)=>view.setInt16(i*2,Math.max(-32768,Math.min(32767,Math.round(sample*32768))),true));if(ws.bufferedAmount>320000)throw Error('发送缓冲超限，请重试');if(inputStart===null)inputStart=performance.now();ws.send(pcm);const delay=pacingStart+(start+slice.length)/16-performance.now();if(delay>0)await new Promise(resolve=>setTimeout(resolve,delay))}send({type:'finish'});status('输入结束，正在排空字幕与语音…');
 }catch(error){status(error.message,true);canceled=true;send({type:'cancel'});stopNodes();finishUI()}
}
document.querySelectorAll('[role=tab]').forEach((button,index)=>{button.addEventListener('click',()=>selectMode(button));button.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const tabs=[...document.querySelectorAll('[role=tab]')],next=event.key==='Home'?0:event.key==='End'?2:(index+(event.key==='ArrowRight'?1:2))%3;selectMode(tabs[next]);tabs[next].focus()})});$('start').addEventListener('click',start);$('language').addEventListener('change',updateAvailability);$('cancel').addEventListener('click',()=>{canceled=true;send({type:'cancel'});stopNodes();if(!ws||ws.readyState!==WebSocket.OPEN){ws?.close();status('已取消。');finishUI()}else status('正在取消并清理推理资源…')});window.addEventListener('pagehide',()=>{canceled=true;send({type:'cancel'});stopNodes();ws?.close();context?.close()});
fetch('/v1/audio/stream/capabilities').then(r=>{if(!r.ok)throw Error('能力查询失败');return r.json()}).then(value=>{capabilities=value;const button=[...document.querySelectorAll('[role=tab]')].find(b=>b.dataset.mode===location.hash.slice(1));if(button)selectMode(button);else updateAvailability();status(value.enabled?'待开始':'流式处理尚未启用')}).catch(error=>{status(error.message,true);$('start').disabled=true});
</script></body></html>
