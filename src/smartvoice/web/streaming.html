  let durationLimitReached=false;
  if(inputType==='microphone'){
   beginMicrophoneCapture();status(t('micReady'));
   const maxSamples=capabilities?.limits?.max_audio_seconds>0?Math.floor(capabilities.limits.max_audio_seconds*16000):0;
   while(!canceled&&token===run){
    if(micCaptureError)throw Error(t(micCaptureError));
    if(micStopRequested&&!micQueue.length&&!micSamples.length)break;
    let samples=await nextMicrophoneFrame();if(!samples)break;
    if(maxSamples&&inputSamples+samples.length>maxSamples){const remaining=Math.max(0,maxSamples-inputSamples);if(remaining)samples=samples.subarray(0,remaining);stopMicrophoneCapture();micQueue=[];micSamples=[];durationLimitReached=true}
    if(samples.length&&!await sendInput(samples))return;
    if(maxSamples&&inputSamples>=maxSamples){stopMicrophoneCapture();micQueue=[];micSamples=[];durationLimitReached=true;break}
   }
  }else{
   let nextInputTime=performance.now();
   for(let start=0;start<audio.length;start+=320){
    if(!await connected())return;
    const slice=audio.subarray(start,start+320);if(!await sendInput(slice))return;
    nextInputTime=Math.max(nextInputTime,performance.now())+slice.length/16;const delay=nextInputTime-performance.now();if(delay>0)await new Promise(resolve=>setTimeout(resolve,delay));
   }
  }
  if(canceled||!await connected())return;
  stopMicrophoneCapture();finishRequested=true;send({type:'finish'});status(durationLimitReached?t('micMaxDuration'):t('finishDrain'));
 }catch(error){
  const message=error.name==='NotAllowedError'?t('micPermissionDenied'):error.message===t('micOverrun')?t('micOverrun'):error.name==='NotSupportedError'||error.name==='ReferenceError'?t('audioUnsupported'):error.message===t('durationLimit')||error.message===t('onsetLimit')?error.message:t('audioStartupFailed');
  status(message,true);canceled=true;send({type:'cancel'});stopNodes();stopMicrophoneCapture();finishUI()
 }
}
async function loadCapabilities(){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);if($('retryCapabilities'))$('retryCapabilities').hidden=true;if($('start'))$('start').disabled=true;capabilitiesLoaded=false;status(t('loading'));try{const response=await fetch('/v1/audio/stream/capabilities',{signal:controller.signal,headers:{accept:'application/json'}});if(!response.ok)throw Error(`HTTP ${response.status}`);const value=await response.json();if(!Array.isArray(value.chains))throw Error('Invalid capabilities response');capabilities=value;capabilitiesLoaded=true;const requestedMode=location.hash.slice(1);const modeSelect=$('mode');if(modeSelect){if(['transcription','translated_subtitles','spoken_interpretation'].includes(requestedMode))modeSelect.value=requestedMode;mode=modeSelect.value||mode}updateAvailability();status(value.enabled?t('enabled'):t('serviceOff'))}catch(error){console.error('Streaming capability request failed:',error);capabilitiesLoaded=false;updateAvailability();status(error.name==='AbortError'?t('capabilityTimeout'):t('capabilityError'),true);if($('retryCapabilities'))$('retryCapabilities').hidden=false}finally{clearTimeout(timeout)}}
function initializeStreamingPage(){initializeLocale();$('start')?.addEventListener('click',start);$('inputSource')?.addEventListener('change',selectInputSource);document.querySelectorAll?.('[data-input-source]').forEach(button=>button.addEventListener('click',()=>{if(starting)return;$('inputSource').value=button.dataset.inputSource;selectInputSource()}));selectInputSource();$('stopInput')?.addEventListener('click',()=>{stopMicrophoneCapture();status(t('finishDrain'))});$('language')?.addEventListener('change',updateAvailability);$('cancel')?.addEventListener('click',()=>{canceled=true;send({type:'cancel'});stopNodes();stopMicrophoneCapture();if(!ws||ws.readyState!==WebSocket.OPEN){ws?.close();status(t('canceled'));finishUI()}else status(t('canceling'))});window.addEventListener('pagehide',()=>{canceled=true;send({type:'cancel'});stopNodes();stopMicrophoneCapture();ws?.close();context?.close()});$('#retryCapabilities')?.addEventListener('click',loadCapabilities);$('#localeSelect')?.addEventListener('change',event=>{try{localStorage.setItem('smartvoice-locale',event.target.value)}catch(_){}applyLocale(event.target.value)});loadCapabilities()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initializeStreamingPage,{once:true});else initializeStreamingPage();
</script></body></html>
