[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartvoice-sdk"
version = "0.3.0"
description = "Asynchronous Python SDK for SmartVoice STT, TTS, and Streaming"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0", "websockets>=13,<17"]

[tool.setuptools.packages.find]
where = ["src"]
